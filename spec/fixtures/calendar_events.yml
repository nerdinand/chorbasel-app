choir_practice:
  uid: random
  event_created_at: <%= Time.zone.now %>
  starts_at: <%= 1.day.from_now.change(hour: 20) %>
  ends_at: <%= 1.day.from_now.change(hour: 21, minute: 50) %>
  summary: Reguläre Chorprobe

choir_concert:
  uid: random3
  event_created_at: <%= Time.zone.now %>
  starts_at: <%= 1.week.from_now.change(hour: 16) %>
  ends_at: <%= 1.week.from_now.change(hour: 18) %>
  summary: Konzert

christmas_concert:
  uid: random4
  event_created_at: <%= Time.zone.now %>
  starts_at: <%= Date.parse('2026-12-13 20:00:00') %>
  ends_at: <%= Date.parse('2026-12-13 22:00:00') %>
  summary: Weihnachtskonzert
